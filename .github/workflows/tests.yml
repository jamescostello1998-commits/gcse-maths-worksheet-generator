name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  backend:
    name: Backend (pytest)
    # windows-latest, not ubuntu-latest: app/pdf/fraction_images.py hardcodes
    # Windows TrueType font paths (C:\Windows\Fonts\arial.ttf/arialbd.ttf) by
    # design, matching this app's own local-Windows-dev-tool identity (see
    # CLAUDE.md's "Environment gotchas" section) - those paths don't exist on
    # Linux runners, which fails every PDF-rendering test that touches a
    # fraction with `OSError: cannot open resource`.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
